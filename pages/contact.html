<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Janae by email or phone.">
    <title>Janae | Contact</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="index.html">Janae<span>.</span></a>
        <nav class="top-nav" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-main contact-main">
        <section class="page-intro" aria-labelledby="contact-title">
            <p class="eyebrow">Contact</p>
            <h1 id="contact-title">Contact me</h1>
            <p>Email or call me:</p>
        </section>
        <address class="contact-card">
            <p><span class="contact-label">Email</span><a href="mailto:janae@example.com">janae@example.com</a></p>
            <p><span class="contact-label">Phone</span><a href="tel:+11234567890">123-456-7890</a></p>
        </address>

        <section class="message-section" aria-labelledby="message-title">
            <h2 id="message-title">Leave a message</h2>
            <form id="message-form" class="message-form">
                <label for="visitor-name">Name</label>
                <input id="visitor-name" name="name" type="text" required>

                <label for="visitor-email">Email</label>
                <input id="visitor-email" name="email" type="email" required>

                <label for="visitor-message">Message</label>
                <textarea id="visitor-message" name="message" rows="4" maxlength="300" required></textarea>
                <p id="character-count">300 characters remaining</p>

                <button class="button" type="submit">Preview message</button>
            </form>
            <div id="message-preview" class="message-preview" aria-live="polite" hidden></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Made with care by Janae</p>
        <p>&copy; 2026 Janae's Page. All rights reserved.</p>
    </footer>
</body>
</html>
